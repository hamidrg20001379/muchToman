# The instrumented UI smoke suite (plan 008), deliberately OFF the blocking path: on demand
# and once a week, never on push. It joins check.yml/release.yml only after it has proven
# stable over a few weeks of these runs — and that promotion is a human decision.
name: ui-check

on:
  workflow_dispatch:
  schedule:
    # Friday 03:00 UTC — a quiet hour, and early enough that a red run is seen the same day.
    - cron: "0 3 * * 5"

permissions:
  contents: read

jobs:
  connected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-cleanup: always

      # Copied from release.yml, for the same reason it is there: without KVM the emulator
      # falls back to software emulation, boots in minutes and then stops answering adb. The
      # runner has /dev/kvm but its user is not in the kvm group, so hand it out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image is already supplied by the runner; this keeps the slow part, the AVD
      # boot snapshot. The version suffix is bumped if emulator options or the image change.
      - name: Restore API 30 emulator snapshot
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30-default-x86_64-v1

      - name: Create API 30 emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: echo "Generated API 30 AVD snapshot."

      # Same image as release.yml's launch smoke test — API 30 AOSP x86_64, swiftshader,
      # no window — so a flake here is a flake in the suite, never a novelty of the image.
      # Both editions run: the lite frame is its own claim (LiteSmokeTest), and one variant
      # alone could not check it.
      - name: Run the UI smoke suite on an emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot-save -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew connectedFullDebugAndroidTest connectedLiteDebugAndroidTest

      # The failure's own words, or a red weekly run is a mystery to whoever opens it Monday.
      - name: Upload the instrumented-test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
